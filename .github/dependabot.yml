# GitHub reads this on master; PLANK consumes plank/main.
# Keep the same policy on both branches, without advancing inherited master pins.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: plank/main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
